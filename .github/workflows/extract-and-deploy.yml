name: Extract site zip and deploy

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the zip
        id: find
        run: |
          set -e
          ZIP=$(find . -path ./.git -prune -o -iname "*.zip" -print | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found anywhere in the repository. Upload trojan-vpn-site.zip to the repo root."
            exit 1
          fi
          echo "Using $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract zip into repository root
        run: |
          set -e
          # remove old site files so renamed/deleted assets do not linger
          rm -rf assets *.html site.css site.js build_pages.py README.md
          unzip -o -q "${{ steps.find.outputs.zip }}" -d .
          rm -f index.backup.html
          touch .nojekyll
          echo "Extracted files:"; ls -la

      - name: Commit extracted files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "chore: extract site zip"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: extract
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
